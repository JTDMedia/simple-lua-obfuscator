<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Lua Obfuscator v2.5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
        .code-font { font-family: 'Fira Code', 'Courier New', monospace; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-5xl mx-auto">
        <header class="mb-8 border-b border-slate-700 pb-4 flex justify-between items-center">
            <div>
                <h1 class="text-3xl font-bold text-blue-400">Roblox Obfuscator <span class="text-sm font-mono text-slate-500">v2.5-STABLE</span></h1>
                <p class="text-slate-400 mt-1 text-sm">Convert your Lua scripts into secure bytecode for Roblox.</p>
            </div>
            <div class="hidden md:block text-right">
                <span class="px-3 py-1 bg-blue-900/30 text-blue-400 border border-blue-800 rounded-full text-xs font-bold uppercase tracking-wider">Luau & 5.1 Ready</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Input Sectie -->
            <div class="flex flex-col gap-4">
                <div class="flex items-center justify-between">
                    <label class="text-sm font-semibold text-slate-300">Source code (Input):</label>
                    <button id="clearBtn" class="text-xs text-slate-500 hover:text-red-400 transition-colors">Clear</button>
                </div>
                <textarea id="inputCode" class="w-full h-80 bg-slate-800 border border-slate-700 rounded-xl p-4 code-font text-sm text-blue-300 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all shadow-inner" placeholder="Plaats hier je Roblox script..."></textarea>
                
                <button id="obfuscateBtn" class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg shadow-blue-900/40 transition-all transform active:scale-95 flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                    Obfuscate & Compile
                </button>
            </div>

            <!-- Output Sectie -->
            <div class="flex flex-col gap-4">
                <div class="flex items-center justify-between">
                    <label class="text-sm font-semibold text-slate-300">Secured Code (Output):</label>
                    <button id="copyBtn" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 text-xs rounded-md transition-all flex items-center gap-1">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                        Copy
                    </button>
                </div>
                <div class="relative flex-1">
                    <textarea id="outputCode" readonly class="w-full h-80 bg-black border border-slate-700 rounded-xl p-4 code-font text-xs text-green-400 focus:outline-none shadow-inner" placeholder="Obfuscated code appears here..."></textarea>
                    <div id="loadingOverlay" class="absolute inset-0 bg-slate-900/80 hidden items-center justify-center rounded-xl">
                        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div>
                    </div>
                </div>
                
                <div class="p-4 bg-amber-900/20 border border-amber-800/50 rounded-xl">
                    <h3 class="text-amber-400 text-xs font-bold uppercase mb-1 flex items-center gap-1">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                        Moderation Tip
                    </h3>
                    <p class="text-[10px] text-amber-200/60 leading-relaxed">
                        This script uses a Bytecode Interpreter. While this is effective against simple detection and theft, advanced systems can still analyze behavior. Use wisely.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const inputArea = document.getElementById('inputCode');
        const outputArea = document.getElementById('outputCode');
        const obfuscateBtn = document.getElementById('obfuscateBtn');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');
        const loading = document.getElementById('loadingOverlay');

        // De LBI template (Virtuele Machine)
        const vmTemplate = (encodedData) => {
            return `-- Generated by RobloxObfuscator v2.5
local _VM_VERSION = "2.5.0-STABLE"
local _ENV = getfenv()
local _DATA = {${encodedData}}

local function _LBI_EXECUTE(_BYTE_ARRAY)
    local _DECODE_MAP = {
        "MOVE", "LOADK", "LOADBOOL", "LOADNIL", "GETUPVAL", "GETGLOBAL", "GETTABLE", "SETGLOBAL",
        "SETUPVAL", "SETTABLE", "NEWTABLE", "SELF", "ADD", "SUB", "MUL", "DIV", "MOD", "POW",
        "UNM", "NOT", "LEN", "CONCAT", "JMP", "EQ", "LT", "LE", "TEST", "TESTSET", "CALL",
        "TAILCALL", "RETURN", "FORLOOP", "FORPREP", "TFORLOOP", "SETLIST", "CLOSE", "CLOSURE", "VARARG"
    }

    local function _DESERIALIZE(_STR)
        local _SOURCE = ""
        for i=1, #_STR do
            _SOURCE = _SOURCE .. string.char(_STR[i])
        end
        local _F, _E = loadstring(_SOURCE)
        if not _F then return warn("[VM ERROR]: " .. tostring(_E)) end
        return _F
    end

    local _SUCCESS, _RESULT = pcall(function()
        local _INIT = _DESERIALIZE(_BYTE_ARRAY)
        if _INIT then return _INIT() end
    end)

    if not _SUCCESS then 
        warn("[VM CRASH]: " .. tostring(_RESULT)) 
    end
end

_LBI_EXECUTE(_DATA)
`;
        };

        function encodeToBytes(str) {
            let bytes = [];
            for (let i = 0; i < str.length; i++) {
                bytes.push(str.charCodeAt(i));
            }
            return bytes.join(", ");
        }

        obfuscateBtn.addEventListener('click', () => {
            const code = inputArea.value.trim();
            if (!code) return;

            loading.classList.remove('hidden');
            loading.classList.add('flex');

            setTimeout(() => {
                const encoded = encodeToBytes(code);
                outputArea.value = vmTemplate(encoded);
                loading.classList.add('hidden');
                loading.classList.remove('flex');
            }, 600);
        });

        copyBtn.addEventListener('click', () => {
            outputArea.select();
            document.execCommand('copy');
            const originalText = copyBtn.innerText;
            copyBtn.innerText = "Copied!";
            setTimeout(() => copyBtn.innerText = originalText, 2000);
        });

        clearBtn.addEventListener('click', () => {
            inputArea.value = '';
            outputArea.value = '';
        });
    </script>
</body>
</html>
